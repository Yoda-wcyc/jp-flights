<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本便宜機票追蹤</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1b2330; --muted:#5a6575; --line:#e2e6eb;
  --th:#f0f2f5; --hover:#f7f9fb; --link:#1d5fd1; --bar:rgba(245,246,248,.94);
  --btn:#eef2f8; --btn-text:#1d4fae; --btn-line:#d3dcea;
  --accent:#1d5fd1; --accent-text:#ffffff; --hl-bg:#eaf2ff; --hl-line:#c7d9f7;
  --up:#c62828; --up-bg:#fde7e7; --down:#18803c; --down-bg:#e2f4e7;
  --info:#2b5797; --info-bg:#e7eef9; --first:#6b5a12; --first-bg:#f7f0d4;
  --c1:#2563eb; --c2:#d97706; --c3:#7c3aed; --c4:#0e9aa7; --c5:#db2777; --c6:#65a30d; --c7:#78716c;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 2px 8px rgba(20,30,45,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111519; --card:#1a2028; --text:#e7ebf0; --muted:#9ba6b5; --line:#2c3440;
    --th:#212833; --hover:#202731; --link:#82b2ff; --bar:rgba(17,21,25,.94);
    --btn:#223047; --btn-text:#a9c8ff; --btn-line:#34445e;
    --accent:#3b7be8; --accent-text:#ffffff; --hl-bg:#17243a; --hl-line:#2b3f60;
    --up:#ff7a7a; --up-bg:#3b1d20; --down:#5ad98a; --down-bg:#15301f;
    --info:#9cc0ff; --info-bg:#1d2a40; --first:#e8d27a; --first-bg:#353016;
    --c1:#60a5fa; --c2:#fbbf24; --c3:#c4a1ff; --c4:#2dd4bf; --c5:#f472b6; --c6:#a3e635; --c7:#d6d3d1;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  font-size:15px;line-height:1.6}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1152px;margin:0 auto;padding-left:16px;padding-right:16px}
.main{padding-top:22px;padding-bottom:40px}
button{font-family:inherit}
/* 篩選列(sticky,一排) */
.fbar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.frow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding-top:8px;padding-bottom:8px;font-size:14px}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.lbl{color:var(--muted);font-size:13px;white-space:nowrap}
.chip{font-size:13.5px;line-height:1.4;padding:4px 11px;border-radius:999px;border:1px solid var(--btn-line);
  background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--btn);color:var(--btn-text);border-color:var(--btn-text);font-weight:600}
.chip.on::before{content:"✓ "}
.budget{display:flex;align-items:center;gap:6px}
.budget input[type=range]{width:120px;accent-color:var(--c1);margin:0}
.budget input[type=number]{width:86px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--text);font:inherit;font-size:13.5px}
.fspacer{flex:1}
.pbtn{font-size:13px;line-height:1.4;padding:4px 11px;border-radius:6px;border:1px solid var(--btn-line);
  background:var(--btn);color:var(--btn-text);cursor:pointer;white-space:nowrap}
.pbtn:hover{filter:brightness(.96)}
.pbtn.hot{border-color:var(--btn-text);font-weight:600}
.adv{border-top:1px solid var(--line);padding-top:8px;padding-bottom:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.adv[hidden]{display:none}
.fgroup{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.fgroup label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.fgroup input[type=checkbox]{margin:0;width:15px;height:15px;accent-color:var(--c1)}
/* 頁首與一句話結論 */
.hero h1{margin:0 0 10px;font-size:26px;letter-spacing:.02em}
.verdict{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;background:var(--hl-bg);border:1px solid var(--hl-line);
  border-radius:12px;padding:14px 18px}
.verdict .vk{font-size:13px;color:var(--muted);white-space:nowrap}
.verdict .vmain{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.verdict .vcity{font-size:20px;font-weight:700}
.verdict .vprice{font-size:26px;font-weight:800;letter-spacing:.01em}
.verdict .vinfo{font-size:14.5px}
.verdict .vnone{color:var(--muted)}
.verdict .btn-primary{margin-left:auto}
.unit{font-size:12px;color:var(--muted);font-weight:400;white-space:nowrap}
.metaline{color:var(--muted);font-size:12.5px;margin-top:8px}
.fnote{color:var(--muted);font-size:12.5px;margin-top:4px}
.btn-primary{display:inline-block;padding:7px 14px;border-radius:8px;background:var(--accent);color:var(--accent-text);
  font-weight:600;font-size:14px;white-space:nowrap;border:none;cursor:pointer}
.btn-primary:hover{text-decoration:none;filter:brightness(1.07)}
/* 區塊 */
section{margin-top:28px;padding:20px 22px 22px;background:var(--th);border:1px solid var(--line);
  border-top:5px solid var(--c1);border-radius:12px;box-shadow:var(--shadow)}
section h2{font-size:19px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
#sec-promos{border-top-color:var(--c6)} #sec-chart{border-top-color:var(--c4)} #sec-rv{border-top-color:var(--c5)}
.sub{color:var(--muted);font-size:13px;margin:-4px 0 14px}
.none{color:var(--muted)}
/* 城市卡 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border-radius:12px;padding:15px 16px 14px;box-shadow:var(--shadow);border-top:4px solid var(--line);
  display:flex;flex-direction:column;gap:5px;cursor:pointer;outline:2px solid transparent;outline-offset:-1px;min-width:0}
.card:hover{outline-color:var(--line)}
.card.sel{outline-color:var(--link)}
.card:focus-visible{outline-color:var(--link)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .city{font-size:19px;font-weight:700;line-height:1.3}
.card .air{color:var(--muted);font-size:12px}
.card .pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;margin-top:2px}
.card .price{font-size:28px;font-weight:800;letter-spacing:.01em;line-height:1.25}
.card .line{font-size:13.5px}
.card .muted{color:var(--muted);font-size:12.5px}
.card .empty{color:var(--muted);margin-top:10px;font-size:13.5px}
.card .acts{margin-top:auto;padding-top:8px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.minor{font-size:12.5px;color:var(--link);background:none;border:none;padding:0;cursor:pointer}
.minor:hover{text-decoration:underline}
.more{align-self:flex-start;font-size:12.5px;color:var(--muted);background:none;border:none;padding:2px 0 0;cursor:pointer}
.more:hover{color:var(--text)}
.pos{margin:6px 0 0}
.pos .track{position:relative;height:8px;border-radius:4px;border:1px solid var(--line);
  background:linear-gradient(90deg,var(--down-bg),var(--up-bg))}
.pos .mark{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--text);
  border:2px solid var(--card);transform:translate(-50%,-50%)}
.pos .ends{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-top:2px}
.delta-up{color:var(--up);font-weight:600}
.delta-down{color:var(--down);font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.5}
.b-low{color:var(--down);background:var(--down-bg)}
.b-up{color:var(--up);background:var(--up-bg)}
.b-first{color:var(--first);background:var(--first-bg)}
.b-info{color:var(--info);background:var(--info-bg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
/* 明細 */
.detail{margin-top:16px;background:var(--card);border-radius:12px;padding:14px 16px 16px;box-shadow:var(--shadow);
  border-left:5px solid var(--line);scroll-margin-top:64px}
.dhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:4px}
.dhead h3{font-size:17px;margin:0}
.dhead .cnt{color:var(--muted);font-size:12.5px}
.sub2{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
.detail table{box-shadow:none;border:1px solid var(--line)}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--th);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
th.nosort{cursor:default}
th:hover{color:var(--text)}
th .ind{display:inline-block;width:12px;margin-left:3px;font-size:10px;color:var(--text)}
td.num,th.num{text-align:right}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
tr.ow td{color:var(--muted)}
td.empty{color:var(--muted);text-align:center;padding:18px}
.tag-ow{display:inline-block;font-size:11.5px;font-weight:600;padding:0 8px;border-radius:999px;background:var(--first-bg);color:var(--first)}
.acts{display:inline-flex;gap:4px;flex-wrap:nowrap}
.bk{display:inline-block;font-size:12px;line-height:1.5;padding:2px 7px;border-radius:6px;border:1px solid var(--btn-line);
  background:var(--btn);color:var(--btn-text);cursor:pointer;white-space:nowrap}
.bk:hover{text-decoration:none;filter:brightness(.95)}
/* 收合 */
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.arr::before{content:"▸";display:inline-block;width:1em}
details[open]>summary .arr::before{content:"▾"}
.more-how{margin-top:8px;font-size:13.5px}
.more-how>summary{color:var(--link);font-size:13px}
.more-how ul{margin:6px 0 0;padding-left:20px}
.more-how li{margin:2px 0}
/* 走勢 */
.chart-box{background:var(--card);border-radius:10px;padding:16px 20px 12px;box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:7px}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.chart-wrap .axis{fill:var(--muted);font-size:12px}
.chart-wrap .grid{stroke:var(--line);stroke-width:1}
.chart-wrap .budget{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--card);font-size:13px;
  padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:5}
.howline{margin-top:10px;font-size:13.5px;color:var(--muted)}
/* 促銷 */
.promos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.promo{background:var(--card);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.promo .t{font-weight:700;font-size:15px}
.promo dl{display:grid;grid-template-columns:72px 1fr;gap:2px 10px;margin:8px 0 0;font-size:13.5px}
.promo dt{color:var(--muted)}
.promo dd{margin:0}
/* 反向票／單程票方案 */
.steps{margin:0 0 12px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.steps li{background:var(--card);border-radius:8px;padding:9px 12px;font-size:13.5px;box-shadow:var(--shadow)}
.steps b{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;
  background:var(--c5);color:#fff;font-size:12.5px;margin-right:6px}
.cal-sync{color:var(--down);font-size:12.5px}
.legblk{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px}
.legblk>.lbl{font-weight:600;color:var(--text)}
.seg{margin-top:12px;font-weight:700;font-size:14px;padding-top:8px;border-top:1px solid var(--line)}
.seg .muted{font-weight:400;color:var(--muted);font-size:13px}
.plan .seg+.leg{margin-top:6px}
.tk{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:999px;margin-right:6px;background:var(--info-bg);color:var(--info)}
.tk-b{background:var(--first-bg);color:var(--first)}
.save-y{color:var(--down);font-weight:700}
.save-n{color:var(--up);font-weight:700}
.plan .ph .save{margin-left:auto;font-size:14px}
.plan .ph .rec{font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:13.5px}
.opt{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;color:var(--muted)}
.opt .ok{min-width:64px}
.opt b{font-variant-numeric:tabular-nums}
.opt.on{color:var(--text)}
.opt.on .ok{font-weight:700}
.opt.on b{font-size:16px}
.normline{margin-top:10px;font-size:13.5px;background:var(--th);border-radius:8px;padding:6px 10px}
.diffap{margin-top:6px;font-size:13.5px;color:var(--up);font-weight:600}
/* 其他 */
.empty-state{margin-top:28px;background:var(--card);border-radius:12px;padding:48px 24px;text-align:center;box-shadow:var(--shadow)}
.empty-state .big{font-size:24px;font-weight:700}
.empty-state p{color:var(--muted);margin:10px 0 0}
.err{margin-top:16px;padding:12px 16px;border-radius:8px;background:var(--up-bg);color:var(--up)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--card);
  padding:8px 18px;border-radius:8px;font-size:14px;z-index:50;display:none;box-shadow:var(--shadow)}
footer{margin-top:36px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
.statusdet>summary{color:var(--muted);font-size:13px}
.statusdet>summary:hover{color:var(--text)}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:10px}
.panel{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--text)}
.panel h3{font-size:14px;margin:0 0 6px}
.panel ul{margin:0;padding-left:20px}
.reload{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.reload b{color:var(--text);font-variant-numeric:tabular-nums}
/* 分頁 */
.tabs{display:flex;gap:6px;margin-top:18px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:14.5px;padding:8px 14px;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;
  background:none;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-2px}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card);color:var(--text);font-weight:700;border-color:var(--line);border-bottom:2px solid var(--card)}
.tab .soon{font-size:11px;color:var(--first);background:var(--first-bg);border-radius:999px;padding:0 6px;margin-left:4px;font-weight:600}
#sec-rt{border-top-color:var(--c3)} #sec-ow{border-top-color:var(--c7)}
/* 來回票方案:條件面板 */
.rtform{background:var(--card);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.rtrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;font-size:14px}
.rtrow[hidden]{display:none}
.rtrow>.lbl{min-width:76px}
#rt-results>.sub{margin:14px 0 0}
#rt-results>.empty-state{margin-top:16px}
.rtrow select,.rtrow input[type=date],.rtrow input[type=number]{font:inherit;font-size:14px;padding:4px 8px;border:1px solid var(--line);
  border-radius:6px;background:var(--card);color:var(--text);max-width:100%}
.rtrow input[type=number]{width:64px}
.rtrow .fgroup{gap:4px 10px}
.rtmsg{font-size:13px;border-radius:8px;padding:8px 12px;background:var(--hl-bg);border:1px solid var(--hl-line)}
.rtmsg ul{margin:2px 0 0;padding-left:18px}
.rtmsg.bad{background:var(--up-bg);border-color:transparent;color:var(--up)}
.rtmsg.warn{background:var(--first-bg);border-color:transparent;color:var(--first)}
.rtacts{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.rtacts .btn-primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.rtstatus{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 16px}
/* 來回票方案:方案卡 */
.plans{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.plan{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--c3);min-width:0}
.plan.p1{border-left-color:var(--accent)}
.plan .ph{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.plan .rk{font-weight:800;color:var(--muted)}
.plan .tot{font-size:22px;font-weight:800}
.plan .brk{font-size:12.5px;color:var(--muted)}
.plan .pinfo{margin-top:2px;font-size:14px}
.leg{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;margin-top:10px;font-size:13.5px}
.leg .lk{font-weight:700;color:var(--muted)}
.leg .fl{font-weight:600}
.leg .rail{color:var(--text);overflow-wrap:anywhere}
.leg .rail .ico{display:inline-block;vertical-align:-3px;margin-right:4px}
.leg .rail b{font-variant-numeric:tabular-nums}
.leg .warnline{color:var(--up)}
.b-sep{color:var(--first);background:var(--first-bg);cursor:help}
.plan .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.cmpnote{margin-top:12px;font-size:13.5px;background:var(--hl-bg);border:1px solid var(--hl-line);border-radius:8px;padding:8px 12px}
.assume{margin-top:12px;font-size:12.5px;color:var(--muted)}
.assume ul{margin:4px 0 0;padding-left:18px}
/* 找機票 */
#sec-find{border-top-color:var(--accent)}
.qform .qlbl{font-weight:700;color:var(--text);font-size:14.5px;min-width:96px}
.chip.dis,.chip[disabled]{opacity:.35;cursor:not-allowed}
.chip.dis:hover{color:var(--muted)}
.qtrip{display:flex;flex-direction:column;gap:10px}
.qtrip-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.qadd{align-self:flex-start;background:none;border:1px dashed var(--btn-line);color:var(--link);border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.qadd:hover{border-color:var(--link)}
.qstatus{font-size:13px;color:var(--muted)}
.qmoredet{margin-top:0}
.qmorebox{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.qcard{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-left:5px solid var(--line);margin-top:16px;min-width:0}
.qcard.main{border-left-color:var(--accent);border-top:1px solid var(--hl-line)}
.qcard.mini{margin-top:10px;padding:10px 14px}
.qh{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px}
.qk{font-weight:800;color:var(--accent);font-size:15px}
.qtot{font-size:26px;font-weight:800;letter-spacing:.01em}
.qcard.mini .qtot{font-size:18px}
.qtag{font-size:15px;font-weight:600}
.qcard.mini .qtag{font-size:14px}
.qsub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tls{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.tl{display:flex;align-items:baseline;gap:2px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.qcard.mini .tl{font-size:13px}
.tl-d{font-weight:700;white-space:nowrap;flex:none;min-width:118px}
.tl-s{min-width:0;overflow-wrap:anywhere}
.tl-tk{font-size:12px;color:var(--muted)}
.wchip{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;border-radius:999px;background:var(--first-bg);color:var(--first);cursor:help;white-space:nowrap;line-height:1.6}
.qwhy{margin-top:10px;font-size:14px;background:var(--hl-bg);border-radius:8px;padding:6px 10px}
.qwhy b{margin-right:4px}
.qcard .acts{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
.qfoot{margin-top:8px;font-size:12px;color:var(--muted)}
.qmore{margin-top:14px}
@media (max-width:640px){
  .qform .qlbl{min-width:0;width:100%}
  .tl{flex-direction:column;gap:0}
  .tl-d{min-width:0}
  .qtot{font-size:22px}
  .qcard{padding:12px 10px}
}
.budget-m{display:none}
.frow-wrap{position:relative}
.frow-wrap::after{content:"";display:none}
@media (max-width:640px){
  /* 右緣淡出:提示 chips 可往右滑;捲到最右(.at-end)就消失 */
  .frow-wrap::after{display:block;position:absolute;top:0;right:0;bottom:0;width:28px;pointer-events:none;
    background:linear-gradient(90deg,transparent,var(--bar))}
  .frow-wrap.at-end::after{opacity:0}
}
@media (max-width:640px){
  /* 手機:篩選列壓成一排可水平捲動的 chips,預算移進進階面板 */
  .frow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:6px;padding-top:7px;padding-bottom:7px}
  .frow::-webkit-scrollbar{display:none}
  .frow>*{flex:none}
  .frow .chips{flex-wrap:nowrap}
  .frow .fspacer{display:none}
  .budget-d{display:none}
  .budget-m{display:flex;flex-wrap:wrap}
  .adv{max-height:60vh;overflow-y:auto}
  .budget input[type=range]{width:140px}
  .hero h1{font-size:22px}
  .verdict{padding:12px 14px}
  .verdict .btn-primary{margin-left:0}
  section{padding:16px 12px 16px;margin-top:22px}
  .chart-box{padding:12px 10px 10px}
  .cards{grid-template-columns:1fr}
  .plan .ph .save{margin-left:0}
  .legblk{padding:8px 8px}
  .detail{padding:12px 10px 12px}
  .tabs{flex-wrap:wrap;gap:4px}
  .tab{padding:6px 9px;font-size:13.5px}
  .rtform{padding:12px 10px}
  .rtrow>.lbl{min-width:0;width:100%}
  .plan{padding:12px 10px}
  .leg{grid-template-columns:1fr}
}
</style>

<script>
(function(){
'use strict';
var SVGNS = 'http://www.w3.org/2000/svg';
var STORE_KEY = 'jpflights.filters.v1';
var WD = '日一二三四五六';
var D, F, KNOWN, SLIDER_MAX, sortStates = {};
var FADE = null;        // 手機篩選列右緣淡出的檢查函式(視窗大小改變時呼叫)
var UI = {};          // <details> 的開合狀態(只記在這次瀏覽)
var openCity = null;    // 明細展開的城市:null = 預設最便宜那個,'' = 使用者收起(存 localStorage,重新整理後還原)
var advOpen = false;
try { advOpen = localStorage.getItem(STORE_KEY + '.adv') === '1'; } catch (e) {}
try { var oc = localStorage.getItem(STORE_KEY + '.openCity'); if (typeof oc === 'string') openCity = oc; } catch (e) {}
function saveOpenCity(){ try { localStorage.setItem(STORE_KEY + '.openCity', openCity === null ? '' : openCity); } catch (e) {} }
var ATYPE_TEXT = {lcc: '廉航', fsc: '傳統', mix: '混搭', unknown: '未分類'};
var AP = {TPE:'桃園', TSA:'松山', KHH:'高雄', RMQ:'台中', NRT:'成田', HND:'羽田', KIX:'關西', ITM:'伊丹', UKB:'神戶',
          CTS:'新千歲', SDJ:'仙台', FUK:'福岡', HKD:'函館', OKJ:'岡山', TYO:'東京', OSA:'大阪'};
function apName(code){ code = String(code || '').trim(); return code ? (AP[code] ? code + ' ' + AP[code] : code) : '—'; }
function apList(s){ return String(s || '').split('/').map(function(x){ return apName(x); }).join(' / '); }

/* ---------- DOM 小工具 ---------- */
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function add(parent){
  for (var i = 1; i < arguments.length; i++){
    var c = arguments[i];
    if (c === null || c === undefined) continue;
    parent.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return parent;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); return n; }
function extLink(url, text, cls){
  if (!url) return el('span', null, text);
  var a = el('a', cls || null, text);
  a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  return a;
}
function svg(tag, attrs){
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) e.setAttribute(k, attrs[k]);
  return e;
}
function extend(a, b){ var o = {}, k; for (k in a) o[k] = a[k]; for (k in b) o[k] = b[k]; return o; }
function colorVar(n){ return 'var(--c' + n + ')'; }
function fmtNum(n){ return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtNT(n){ return 'NT$ ' + Math.round(n).toLocaleString('en-US'); }
function nonstopText(v){ return v === true ? '直飛' : (v === false ? '轉機' : '—'); }
function cityInfo(name){ for (var i = 0; i < D.cities.length; i++) if (D.cities[i].name === name) return D.cities[i]; return null; }
function badgeEl(b){ var x = el('span', 'badge b-' + b.type, b.text); x.setAttribute('data-badge', b.type); return x; }
/* 收合區塊:預設開合由 defOpen 決定,使用者點過就記住(整頁重繪時保留) */
function detailsBox(id, defOpen, cls){
  var d = el('details', cls || null); d.setAttribute('data-ui', id);
  d.open = (UI[id] === undefined) ? !!defOpen : UI[id];
  var s = el('summary'); add(d, s);
  s.addEventListener('click', function(){ UI[id] = !d.open; });
  return {d: d, s: s};
}

/* ---------- 訂票連結 ---------- */
function ymd(iso){ return (iso || '').slice(0, 10); }
function yymmdd(iso){ var d = ymd(iso).replace(/-/g, ''); return d.length === 8 ? d.slice(2) : ''; }
function destCode(r){ var c = cityInfo(r.city); return r.dest || (c ? c.code : ''); }
function gfUrl(r){
  var o = r.origin, d = destCode(r);
  if (!o || !d || !ymd(r.depart)) return '';
  var q = 'Flights from ' + o + ' to ' + d + ' on ' + ymd(r.depart);
  if (r.trip === 'roundtrip' && ymd(r['return'])) q += ' through ' + ymd(r['return']);
  return 'https://www.google.com/travel/flights?q=' + encodeURIComponent(q) + '&curr=TWD&hl=zh-TW';
}
function ssUrl(r){
  var o = r.origin.toLowerCase(), d = destCode(r).toLowerCase(), a = yymmdd(r.depart);
  if (!o || !d || !a) return '';
  var u = 'https://www.skyscanner.com.tw/transport/flights/' + o + '/' + d + '/' + a + '/';
  if (r.trip === 'roundtrip' && yymmdd(r['return'])) u += yymmdd(r['return']) + '/';
  return u + '?adultsv2=1&currency=TWD';
}
function shortDay(iso){
  var p = ymd(iso).split('-');
  if (p.length !== 3) return iso || '';
  var wd = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay();
  return (+p[1]) + '/' + (+p[2]) + '(' + WD.charAt(wd) + ')';
}
function dateRange(r){ return shortDay(r.depart) + (r.trip === 'roundtrip' && r['return'] ? '–' + shortDay(r['return']) : ' 單程'); }
function compactPrice(r){ return r.currency === 'TWD' ? 'NT$' + fmtNum(r.price) : r.currency + ' ' + fmtNum(r.price); }
function copyLine(r){
  var dates = shortDay(r.depart) + (r.trip === 'roundtrip' && r['return'] ? '–' + shortDay(r['return']) : ' 單程');
  return [r.city, r.origin + '→' + destCode(r), r.airline, dates, nonstopText(r.nonstop), compactPrice(r), gfUrl(r)].join('｜');
}

/* ---------- 剪貼簿 ---------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 1600);
}
function copyFallback(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', '');
  ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  toast(ok ? '已複製' : '複製失敗,請手動複製');
}
function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      // 剪貼簿 API 失敗或 1 秒內沒回應(某些環境會卡住)就退回 textarea + execCommand
      var done = false;
      var timer = setTimeout(function(){ if (!done){ done = true; copyFallback(text); } }, 1000);
      navigator.clipboard.writeText(text).then(
        function(){ if (!done){ done = true; clearTimeout(timer); toast('已複製'); } },
        function(){ if (!done){ done = true; clearTimeout(timer); copyFallback(text); } });
      return;
    }
  } catch (e) {}
  copyFallback(text);
}
function copyBtn(r, cls, text){
  var c = el('button', cls, text);
  c.type = 'button';
  c.setAttribute('data-copy', copyLine(r));
  c.title = '複製一行文字:' + c.getAttribute('data-copy');
  c.addEventListener('click', function(){ copyText(c.getAttribute('data-copy')); });
  return c;
}
/* 明細表用的小按鈕 */
function actions(r){
  var box = el('span', 'acts');
  var g = gfUrl(r), k = ssUrl(r);
  if (g) add(box, extLink(g, 'Google Flights', 'bk bk-gf'));
  if (k) add(box, extLink(k, 'Skyscanner', 'bk bk-ss'));
  add(box, copyBtn(r, 'bk bk-copy', '複製'));
  return box;
}

/* ---------- 篩選狀態 ---------- */
function allCities(){ return D.cities.map(function(c){ return c.name; }); }
function allAtypes(){ return D.atypes.map(function(a){ return a.k; }); }
function allFscs(){ return D.fsc_list.map(function(a){ return a.k; }); }
function defaults(){ return {origins: D.origins.slice(), cities: allCities(), atypes: allAtypes(), fscs: allFscs(), nonstop: false, budget: null}; }
function loadFilters(){
  var f = defaults();
  try {
    var raw = window.localStorage.getItem(STORE_KEY);
    if (!raw) return f;
    var o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return f;
    if (Object.prototype.toString.call(o.origins) === '[object Array]')
      f.origins = o.origins.filter(function(x){ return D.origins.indexOf(x) >= 0; });
    if (Object.prototype.toString.call(o.cities) === '[object Array]')
      f.cities = o.cities.filter(function(x){ return allCities().indexOf(x) >= 0; });
    if (Object.prototype.toString.call(o.atypes) === '[object Array]')
      f.atypes = o.atypes.filter(function(x){ return allAtypes().indexOf(x) >= 0; });
    if (Object.prototype.toString.call(o.fscs) === '[object Array]')
      f.fscs = o.fscs.filter(function(x){ return allFscs().indexOf(x) >= 0; });
    f.nonstop = o.nonstop === true;
    f.budget = (typeof o.budget === 'number' && isFinite(o.budget) && o.budget > 0) ? o.budget : null;
  } catch (e) { return defaults(); }
  return f;
}
function saveFilters(){
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(F)); } catch (e) {}
}
function originOk(o){ return KNOWN.indexOf(o) < 0 || F.origins.indexOf(o) >= 0; }
/* 航空類型:勾廉航只看純廉航、勾傳統只看純傳統;混搭與未分類要兩個都勾才顯示 */
function atypeOk(t){
  if (t === 'lcc' || t === 'fsc') return F.atypes.indexOf(t) >= 0;
  return F.atypes.length === D.atypes.length;
}
function cityOk(name){ return F.cities.indexOf(name) >= 0; }
function rowOk(r, ignoreBudget){
  if (!originOk(r.origin)) return false;
  if (!atypeOk(r.atype)) return false;
  if (r.fsc && r.fsc.some(function(k){ return F.fscs.indexOf(k) < 0; })) return false;
  if (F.nonstop && r.nonstop !== true) return false;
  if (!ignoreBudget && F.budget !== null && r.currency === 'TWD' && r.price > F.budget) return false;
  return true;
}
function bucketOk(b){
  var p = b.split('|');
  return originOk(p[0]) && (!F.nonstop || p[1] === 'y') && atypeOk(p[2] || 'unknown');
}
function scanMin(entry, city){
  var m = entry.m[city]; if (!m) return null;
  var best = null;
  for (var b in m) if (Object.prototype.hasOwnProperty.call(m, b) && bucketOk(b)){
    if (best === null || m[b] < best) best = m[b];
  }
  return best;
}
function rankCmp(a, b){
  var ca = a.currency === 'TWD' ? 0 : 1, cb = b.currency === 'TWD' ? 0 : 1;
  if (ca !== cb) return ca - cb;
  if (a.price !== b.price) return a.price - b.price;
  return (a.depart || '9999') < (b.depart || '9999') ? -1 : ((a.depart || '9999') > (b.depart || '9999') ? 1 : 0);
}

/* ---------- 依篩選重算 ---------- */
function computeCity(c){
  var rows = D.rows.filter(function(r){ return r.city === c.name && rowOk(r, false); });
  var rt = rows.filter(function(r){ return r.trip === 'roundtrip'; }).sort(rankCmp);
  var ow = rows.filter(function(r){ return r.trip === 'oneway'; }).sort(rankCmp);
  var anyNoBudget = D.rows.some(function(r){ return r.city === c.name && r.trip === 'roundtrip' && rowOk(r, true); });
  var best = rt.length ? rt[0] : null;
  var st = {city: c, best: best, badge: null, rt: rt, ow: ow, delta: null, prev: null, low: null,
            overBudget: !best && anyNoBudget && F.budget !== null};
  if (best){
    if (best.currency !== 'TWD') st.badge = {type:'info', text:'非台幣·不比較'};
    else {
      var past = D.hist.filter(function(e){ return e.t < D.latest.t; })
        .map(function(e){ return scanMin(e, c.name); }).filter(function(v){ return v !== null; });
      if (!past.length) st.badge = {type:'first', text:'首次掃描'};
      else {
        st.low = Math.min.apply(null, past);
        st.prev = past[past.length - 1];
        st.delta = (best.price - st.prev) / st.prev * 100;
        if (best.price < st.low) st.badge = {type:'low', text:'歷史新低'};
        else if (best.price > st.prev * (1 + D.up_threshold_pct / 100)) st.badge = {type:'up', text:'漲'};
      }
    }
  }
  // 明細:符合篩選的全部來回(由便宜到貴)+ 單程最低一筆
  var table = rt.map(function(r, i){ return extend(r, {rank_sort: i + 1}); });
  if (ow.length) table.push(extend(ow[0], {rank_sort: rt.length + 1}));
  st.table = table;
  st.series = D.hist.map(function(e){ var v = scanMin(e, c.name); return v === null ? null : {t: e.t, label: e.label, price: v}; })
    .filter(function(p){ return p !== null; });
  return st;
}

/* ---------- 篩選列(常用一排 + 進階面板) ---------- */
function budgetText(){ return F.budget === null ? '不限' : fmtNT(F.budget) + ' 以內'; }
function setChip(b, on){ b.className = b.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ').trim() + (on ? ' on' : ''); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
function chip(text, on, extraCls, onClick){
  var b = el('button', 'chip' + (extraCls ? ' ' + extraCls : ''), text);
  b.type = 'button'; setChip(b, on);
  b.addEventListener('click', function(){ onClick(b); });
  return b;
}
function advCount(){
  var n = 0;
  if (F.cities.length !== D.cities.length) n++;
  if (F.atypes.length !== D.atypes.length) n++;
  if (F.fscs.length !== D.fsc_list.length) n++;
  return n;
}
function updateAdvBtn(){
  var b = document.getElementById('f-adv'); if (!b) return;
  var n = advCount();
  b.textContent = '進階篩選' + (n ? '(' + n + ' 項)' : '') + (advOpen ? ' ▾' : ' ▸');
  b.setAttribute('aria-expanded', advOpen ? 'true' : 'false');
  b.className = 'pbtn' + (n ? ' hot' : '');
}
function buildFilterBar(hasData){
  var bar = clear(document.getElementById('fbar'));
  if (!hasData){ bar.style.display = 'none'; return; }
  bar.style.display = '';
  var rowWrap = el('div', 'frow-wrap'), row = el('div', 'wrap frow'); add(rowWrap, row); add(bar, rowWrap);
  function fadeCheck(){
    var end = row.scrollWidth - row.clientWidth - row.scrollLeft <= 2;
    rowWrap.className = 'frow-wrap' + (end ? ' at-end' : '');
  }
  row.addEventListener('scroll', fadeCheck);
  FADE = fadeCheck;
  setTimeout(fadeCheck, 0);
  // 出發機場
  var g1 = el('div', 'chips'); add(g1, el('span', 'lbl', '出發'));
  D.origins.forEach(function(o){
    var b = chip(apName(o), F.origins.indexOf(o) >= 0, 'f-origin', function(btn){
      var on = F.origins.indexOf(o) < 0;
      F.origins = D.origins.filter(function(x){ return x === o ? on : F.origins.indexOf(x) >= 0; });
      setChip(btn, on); changed();
    });

function startReload(){
  var deadline = Date.now() + D.reload_min * 60 * 1000;
  function tick(){
    var left = Math.max(0, Math.round((deadline - Date.now()) / 1000));
    var cd = document.getElementById('reload-countdown');
    if (cd) cd.textContent = Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);

var COLS = [
  {k:'origin',  t:'出發機場', num:false, v:function(r){return r.origin + '>' + r.dest;}},
  {k:'airline', t:'航空',     num:false, v:function(r){return r.airline;}},

  {k:'return',  t:'回程',     num:false, v:function(r){return r['return'] || '';}},
  {k:'nonstop', t:'直飛',     num:true,  v:function(r){return r.nonstop === true ? 0 : (r.nonstop === false ? 1 : 2);}},
  {k:'price',   t:'含稅價',   num:true,  v:function(r){return r.price;}},
  {k:'act',     t:'訂票',     nosort:true}
];
function cellFor(col, r){
  var td = el('td');
  switch (col.k){
    case 'origin': td.textContent = apName(r.origin) + (r.dest ? ' → ' + apName(r.dest) : ''); break;
    case 'airline': td.textContent = r.airline; break;
    case 'depart': td.textContent = r.depart ? shortDay(r.depart) : '—'; td.title = r.depart_text; break;
    case 'return':

      else { td.textContent = r['return'] ? shortDay(r['return']) : '—'; td.title = r.return_text; }
      break;
    case 'nonstop': td.textContent = nonstopText(r.nonstop); break;
    case 'price': td.className = 'num'; add(td, el('b', null, r.price_text)); break;
    case 'act': add(td, actions(r)); break;
  }

}
function sortableTable(rows, city){
  var table = el('table'); table.setAttribute('data-city', city);
  var thead = el('thead'), trh = el('tr'), tbody = el('tbody');
  var state = sortStates[city] || (sortStates[city] = {k:null, dir:1});
  var inds = {};
  COLS.forEach(function(col){
    var th = el('th', col.nosort ? 'nosort' : (col.k === 'price' ? 'num' : null));
    th.setAttribute('data-key', col.k);
    if (col.nosort){ add(th, col.t); add(trh, th); return; }
    th.title = '點一下排序(再點一次反向)';
    var ind = el('span', 'ind', ''); inds[col.k] = ind;
    add(th, col.t, ind);
    th.addEventListener('click', function(){
      if (state.k === col.k) state.dir = -state.dir; else { state.k = col.k; state.dir = 1; }
      render();
    });
    add(trh, th);
  });
  add(thead, trh); add(table, thead, tbody);
  function render(){
    var list = rows.slice();
    if (state.k){
      var col = COLS.filter(function(c){ return c.k === state.k; })[0];
      list.sort(function(a, b){
        var va = col.v(a), vb = col.v(b), r;
        if (col.num) r = va - vb;
        else {
          if (va === '' && vb !== '') return 1;
          if (vb === '' && va !== '') return -1;
          r = String(va).localeCompare(String(vb), 'zh-Hant');
        }
        if (r === 0) r = a.rank_sort - b.rank_sort;
        return r * state.dir;
      });
    }
    clear(tbody);
    if (!list.length){
      var tr0 = el('tr'), td0 = el('td', 'empty', '目前篩選條件下,本次掃描沒有這個城市的報價。');
      td0.colSpan = COLS.length; add(tr0, td0); add(tbody, tr0);
    }
    list.forEach(function(r){
      var tr = el('tr', r.trip === 'oneway' ? 'ow' : null);
      tr.title = (r.trip === 'oneway' ? '單程 · ' : '') + '航空類型:' + (ATYPE_TEXT[r.atype] || '未分類') +
        ' · 來源:' + r.source + ' · 抓取時間:' + r.scan_text;
      COLS.forEach(function(col){ add(tr, cellFor(col, r)); });
      add(tbody, tr);
    });
    for (var k in inds){
      var th = inds[k].parentNode;
      if (state.k === k){ inds[k].textContent = state.dir === 1 ? '▲' : '▼'; th.setAttribute('aria-sort', state.dir === 1 ? 'ascending' : 'descending'); }
      else { inds[k].textContent = ''; th.removeAttribute('aria-sort'); }
    }
  }
  render();
  return table;
}

/* ---------- 價格走勢 ---------- */
function niceStep(range, ticks){
  var raw = range / Math.max(1, ticks);
  var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var m = raw / p;
  return (m <= 1 ? 1 : (m <= 2 ? 2 : (m <= 2.5 ? 2.5 : (m <= 5 ? 5 : 10)))) * p;
}
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function tpeParts(t){
  var d = new Date(t + 8 * 3600 * 1000);
  return {mo: pad2(d.getUTCMonth() + 1), da: pad2(d.getUTCDate()), h: pad2(d.getUTCHours()), mi: pad2(d.getUTCMinutes())};
}

    var tMin = Infinity, tMax = -Infinity, pMin = Infinity, pMax = -Infinity;
    pts.forEach(function(p){ tMin = Math.min(tMin, p.t); tMax = Math.max(tMax, p.t); pMin = Math.min(pMin, p.price); pMax = Math.max(pMax, p.price); });

    states.forEach(function(st){

        var hit = svg('circle', {cx:cx, cy:cy, r:11, fill:'transparent', 'class':'hit'}); hit.style.cursor = 'pointer';

/* ===================== 找機票:單一條件 =====================
   儲存格式(定案,欄位名不准改):config/search
   {home, cities, trips:[{depart_from,depart_to,nights_min,nights_max}](1 或 2 趟), origins, airlines:{mode,list}, nonstop_only, updated_at}
   用輸入限制取代錯誤訊息:選不出違規的組合。 */
var Q_KEY = STORE_KEY + '.search', Q_TOUCH_KEY = STORE_KEY + '.search.otouched';
// 上限集中在這裡(之後依實測調整)
var Q_MAX_CITIES = 2, Q_MAX_COMBOS = 4;          // 城市最多 2 個;機場 × 城市最多 4 組
var Q_SPAN_ONE = 14, Q_SPAN_TWO = 6;             // 出發日區間(含頭尾):一趟 14 天;兩趟每趟 6 天(晚數彈性固定 1,6+1=7 符合反向票掃描上限)
var Q_AHEAD_ONE = 180, Q_AHEAD_TWO = 330;        // 起日最遠:今天 +180;第二趟 +330
var Q_MIN_ONE = 9, Q_MIN_TWO = 5;                // 預估掃描分鐘/每組機場×城市(一趟=來回 4＋單程 5;兩趟=反向票 5)

  '台南': ['KHH', 'TPE'], '嘉義': ['KHH', 'TPE'], '左營': ['KHH', 'TPE'],
  '台北': ['TPE', 'TSA'], '南港': ['TPE', 'TSA'], '板橋': ['TPE', 'TSA'], '桃園': ['TPE', 'TSA'], '新竹': ['TPE', 'TSA'],
  '苗栗': ['TPE', 'KHH'], '台中': ['TPE', 'KHH'], '彰化': ['TPE', 'KHH'], '雲林': ['TPE', 'KHH']
};
var QC = null, QF = null, QDB = null, Q_SYNC = '', Q_TOUCH = false, PL = [];
try { Q_TOUCH = localStorage.getItem(Q_TOUCH_KEY) === '1'; } catch (e) {}
function homeOrigins(h){ return (HOME_ORIGINS[h] || ['TPE', 'KHH']).filter(function(o){ return D.origins.indexOf(o) >= 0; }); }
function qDefault(){
  var t = todayIso();
  return {home: '台南', cities: ['東京'], trips: [{depart_from: addDays(t, 30), depart_to: addDays(t, 36), nights_min: 4, nights_max: 5}],
          origins: homeOrigins('台南'), airlines: {mode: 'any', list: []}, nonstop_only: true, updated_at: ''};
}
/* 外來資料(雲端／localStorage／search_config.json 的 search 鍵)→ 乾淨的條件;認不出來回傳 null */
function qClean(o){
  if (!o || typeof o !== 'object' || !isArr(o.cities) || !isArr(o.trips) || !o.trips.length) return null;
  var d = qDefault(), dt = d.trips[0], codes = airList().map(function(a){ return a.k; });
  var al = (o.airlines && typeof o.airlines === 'object') ? o.airlines : {};
  var home = hsrStations().indexOf(o.home) >= 0 ? o.home : d.home;
  var c = {
    home: home,
    cities: allCities().filter(function(x){ return o.cities.indexOf(x) >= 0; }).slice(0, Q_MAX_CITIES),
    trips: o.trips.slice(0, 2).map(function(t){
      t = (t && typeof t === 'object') ? t : {};
      return {depart_from: isIso(t.depart_from) ? t.depart_from : dt.depart_from, depart_to: isIso(t.depart_to) ? t.depart_to : dt.depart_to,
              nights_min: intOr(t.nights_min, dt.nights_min), nights_max: intOr(t.nights_max, dt.nights_max)};
    }),
    origins: isArr(o.origins) ? D.origins.filter(function(x){ return o.origins.indexOf(x) >= 0; }) : homeOrigins(home),
    airlines: {mode: ['any', 'lcc', 'fsc', 'list'].indexOf(al.mode) >= 0 ? al.mode : 'any',
               list: isArr(al.list) ? codes.filter(function(k){ return al.list.indexOf(k) >= 0; }) : []},
    nonstop_only: typeof o.nonstop_only === 'boolean' ? o.nonstop_only : true,
    updated_at: typeof o.updated_at === 'string' ? o.updated_at : ''
  };
  if (!c.cities.length) c.cities = d.cities.slice();
  if (!c.origins.length) c.origins = homeOrigins(home);
  return c;
}
/* 儲存格式(定案,欄位名與順序照規格) */
function qOut(c){
  return {home: c.home, cities: c.cities.slice(),
          trips: c.trips.map(function(t){ return {depart_from: t.depart_from, depart_to: t.depart_to, nights_min: t.nights_min, nights_max: t.nights_max}; }),
          origins: c.origins.slice(),
          airlines: {mode: c.airlines.mode, list: c.airlines.mode === 'list' ? c.airlines.list.slice() : []},
          nonstop_only: c.nonstop_only, updated_at: c.updated_at};
}
function spanMax(c){ return c.trips.length > 1 ? Q_SPAN_TWO : Q_SPAN_ONE; }
function fromMin(c, i){ if (i === 0) return todayIso(); var a = c.trips[0]; return addDays(a.depart_to, a.nights_max + 1); }
function fromMax(c, i){ return addDays(todayIso(), i === 0 ? Q_AHEAD_ONE : Q_AHEAD_TWO); }
function clampIso(x, lo, hi){ return x < lo ? lo : (x > hi ? hi : x); }
/* 把條件拉回允許範圍(不報錯,直接修正) */
function qNorm(c){
  c.cities = c.cities.slice(0, Q_MAX_CITIES);
  while (c.origins.length > 1 && c.origins.length * c.cities.length > Q_MAX_COMBOS) c.origins.pop();
  c.trips = c.trips.slice(0, 2);
  c.trips.forEach(function(t, i){
    if (!(t.nights_min >= 1)) t.nights_min = 1;
    if (t.nights_min > 29) t.nights_min = 29;
    if (t.nights_max < t.nights_min) t.nights_max = t.nights_min;
    var gapMax = c.trips.length > 1 ? 1 : 4;
    if (t.nights_max - t.nights_min > gapMax) t.nights_max = t.nights_min + gapMax;
    t.depart_from = clampIso(t.depart_from, fromMin(c, i), fromMax(c, i));
    t.depart_to = clampIso(t.depart_to, t.depart_from, addDays(t.depart_from, spanMax(c) - 1));
  });
  return c;
}
function tsOfQ(c){ return tsOf(c); }
function qInit(){
  var loc = null;
  try { loc = qClean(JSON.parse(localStorage.getItem(Q_KEY) || 'null')); } catch (e) { loc = null; }
  var emb = qClean(D.search_cfg);
  QC = (loc && emb) ? (tsOf(loc) >= tsOf(emb) ? loc : emb) : (loc || emb);
  QF = qNorm(clone(QC || qDefault()));
}
function qDirty(){
  if (!QC) return true;

}
function qMinutes(c){ return c.origins.length * c.cities.length * (c.trips.length > 1 ? Q_MIN_TWO : Q_MIN_ONE); }
function qScanT(c){
  if (c.trips.length > 1) return D.rv ? D.rv.t : 0;

}
function qSave(){

  c.updated_at = new Date().toISOString();
  QC = clone(c);
  var out = qOut(QC);
  try { localStorage.setItem(Q_KEY, JSON.stringify(out)); } catch (e) {}
  var ok = '已存好。下次排程掃描後(約 ' + qMinutes(QC) + ' 分鐘的掃描量)這裡會出現最划算的方案。';
  if (QDB){
    Q_SYNC = '儲存中…';
    QDB.doc('config/search').set(out).then(
      function(){ Q_SYNC = ok; renderAll(); },
      function(){ Q_SYNC = '雲端儲存失敗(你可能沒有編輯權限),只存在這台瀏覽器。'; renderAll(); });
  } else if (hasCloud()){
    Q_SYNC = '還沒連上雲端,先存在這台瀏覽器;稍後再按一次。';
  } else {
    Q_SYNC = '已存在這台瀏覽器。這個網址存的條件排程讀不到,請到 Claude 上的頁面設定。';
  }
  renderAll();
}
function initQDb(db){
  QDB = db;
  db.doc('config/search').get().then(function(snap){
    var v = (snap && snap.exists) ? qClean(snap.data()) : null;
    if (v){
      var dirty = QC ? qDirty() : false;
      QC = v;
      if (!dirty) QF = qNorm(clone(v));
      try { localStorage.setItem(Q_KEY, JSON.stringify(qOut(v))); } catch (e) {}
    }

  }, function(){ renderAll(); });
}
function qStatus(){
  var dirty = qDirty();
  if (Q_SYNC && !dirty) return Q_SYNC;
  if (!QC) return '還沒存過條件。按「存好，幫我找」,排程就會照這組條件掃描。';
  if (dirty) return '有改動還沒存;下方結果已先照目前畫面重算。';

/* 日期欄:選在範圍內才套用;手動打到範圍外,離開欄位時自動拉回 */
function qDate(id, val, lo, hi, apply){
  var d = el('input'); d.type = 'date'; d.id = id; d.min = lo; d.max = hi; d.value = val;

    if (v === val) return;
    if (!force && (v < lo || v > hi)) return;
    apply(clampIso(v, lo, hi));

  d.addEventListener('change', function(){ go(false); });

  return d;
}

/* ---------- 來回票方案:時間與高鐵 ---------- */
function hm(x){ var m = /^(\d{1,2}):(\d{2})/.exec(String(x || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
/* 分鐘(相對某一天 00:00,可超過 24:00 或為負)→ HH:MM,跨日加註 */
function hmText(min){
  var d = Math.floor(min / 1440), x = min - d * 1440;
  return (d === 1 ? '隔天 ' : (d > 1 ? d + ' 天後 ' : (d < 0 ? '前一天 ' : ''))) + pad2(Math.floor(x / 60)) + ':' + pad2(x % 60);
}
function isoDow(iso){ var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay() || 7; }
/* 一班車各站時間轉成單調遞增的分鐘(過午夜 +1440) */
function normTrain(t){
  var st = {}, pd = -1, ad = 0, pa = -1, aa = 0;
  t.s.forEach(function(x, i){
    var dep = hm(x[1]), arr = hm(x[2]);
    if (dep !== null){ dep += ad; if (dep < pd){ ad += 1440; dep += 1440; } pd = dep; }
    if (arr !== null){ arr += aa; if (arr < pa){ aa += 1440; arr += 1440; } pa = arr; }
    st[x[0]] = {i: i, dep: dep, arr: arr};
  });
  return {n: t.n, d: t.d, st: st};
}
var TRAIN_CACHE = {};
/* 某天實際有開的車:定期表(依星期幾)扣掉 dated.cancel,dated.add 以車次號覆蓋/加開 */
function trainsOn(iso){
  if (TRAIN_CACHE[iso]) return TRAIN_CACHE[iso];
  var T = D.thsr; if (!T) return [];
  var dow = isoDow(iso), dd = T.dated && T.dated[iso];
  var cancel = dd ? dd.cancel : [], adds = dd ? dd.add : [];
  var addNos = adds.map(function(t){ return t.n; });
  var list = T.trains.filter(function(t){ return t.w.indexOf(dow) >= 0 && cancel.indexOf(t.n) < 0 && addNos.indexOf(t.n) < 0; })
    .concat(adds).map(normTrain);
  TRAIN_CACHE[iso] = list;
  return list;
}
/* from 站發車、to 站到站(兩站都停,且順向) */
function legTrains(iso, from, to){
  var out = [];
  trainsOn(iso).forEach(function(t){
    var a = t.st[from], b = t.st[to];
    if (a && b && a.i < b.i && a.dep !== null && b.arr !== null) out.push({n: t.n, dep: a.dep, arr: b.arr});
  });
  return out;
}
/* 接駁營運時段:first~last(last 在 04:00 前視為過午夜);null 視為不檢查 */
function svcWins(first, last){
  var f = hm(first), l = hm(last);
  if (f === null && l === null) return null;
  if (f === null) f = 240;
  if (l === null) l = f + 1439; else if (l < 240) l += 1440;
  var w = [];
  for (var k = -1; k <= 3; k++) w.push([f + 1440 * k, l + 1440 * k]);
  return w;
}
/* t 之後(含)最早可搭的時間;wait=true 表示要等首班 */
function nextSvc(t, first, last){
  var w = svcWins(first, last); if (!w) return {t: t, wait: false};
  for (var i = 0; i < w.length; i++){
    if (t >= w[i][0] && t <= w[i][1]) return {t: t, wait: false};
    if (w[i][0] > t) return {t: w[i][0], wait: true};
  }
  return {t: t, wait: false};
}
function hsrFare(a, b){
  var f = D.thsr && D.thsr.fares;
  if (!f) return null;
  return (f[a] && f[a][b]) || (f[b] && f[b][a]) || null;
}
function stationOf(code){ return {TPE: '桃園', TSA: '台北', KHH: '左營', RMQ: '台中'}[code]; }

/* ===== 共用:台灣端高鐵＋接駁(①②③ 三個分頁都用這組) =====
   planOut(iso, depHm, home, tr):去程航段,iso＝起飛日、depHm＝起飛時刻(分)
   planRet(iso, arrHm, arrDay, home, tr):回程航段,iso＝航班出發日、arrHm＝落地時刻(分)、arrDay＝跨日天數
   legCost(code, home):某台灣機場單趟的高鐵＋接駁費用與註記
   railLeg(kind, code, iso, hmv, day, home):一個航段的費用＋班次(kind = 'out' | 'ret') */
/* 去程:從住家站搭最晚一班、還能在起飛前 2 小時到機場 */
function planOut(iso, dep, home, tr){
  var o = {};
  if (dep === null || dep === undefined){ o.err = '這筆沒有去程起飛時刻,無法排高鐵。'; return o; }
  var atAp = dep - 120, toMin = tr.minutes_to_airport, buf = tr.buffer_min || 0;
  o.atAp = atAp;
  if (home === tr.hsr){
    // 住家站就是轉乘站:只要搭接駁
    var latest = atAp - toMin, sv = nextSvc(latest, tr.first, tr.last);
    if (sv.wait){
      var w = svcWins(tr.first, tr.last), lastEnd = null;
      w.forEach(function(x){ if (x[1] <= latest && x[1] >= latest - 90) lastEnd = x[1]; });
      if (lastEnd === null){ o.err = '要在 ' + hmText(latest) + ' 前搭上' + tr.mode + ',但那時還沒有車(首班 ' + tr.first + '),建議前一晚住機場附近或搭計程車。'; return o; }
      latest = lastEnd;
    }
    o.board = latest; o.arrive = latest + toMin;
    return o;
  }
  var limit = atAp - toMin - buf, cands = legTrains(ymd(iso), home, tr.hsr).sort(function(a, b){ return b.dep - a.dep || b.arr - a.arr; });
  for (var i = 0; i < cands.length; i++){
    var c = cands[i];
    if (c.arr > limit) continue;
    var s2 = nextSvc(c.arr + buf, tr.first, tr.last), arrive = s2.t + toMin;
    if (arrive > atAp) continue;
    o.train = c; o.board = s2.t; o.arrive = arrive; o.mrtWait = s2.wait;
    o.suggest = c.dep - 10;
    return o;
  }
  var first = cands.length ? cands[cands.length - 1] : null;
  o.err = first
    ? '最早一班高鐵(' + first.n + ' 次 ' + hmText(first.dep) + ' 發車)也趕不上起飛前 2 小時(' + hmText(atAp) + ')到機場,建議前一晚住機場附近。'
    : '這天查不到從' + home + '往' + tr.hsr + '的高鐵班次,建議前一晚住機場附近或改搭其他交通工具。';
  return o;
}
/* 回程:落地 + 入境 60 分 + 接駁 + 緩衝之後,最早一班回住家站 */
function planRet(iso, arr, arrDay, home, tr){
  var o = {};
  var rd = ymd(iso);
  if (arr === null || arr === undefined || !rd){ o.err = '這筆沒有回程落地時刻,無法排高鐵。'; return o; }
  var land = arr + 1440 * (arrDay || 0), exit = land + 60, fromMin = tr.minutes_from_airport, buf = tr.buffer_min || 0;
  o.land = land; o.exit = exit;
  var sv = nextSvc(exit, tr.first_from_airport, tr.last_from_airport);
  o.mrtWait = sv.wait; o.board = sv.t;
  if (home === tr.hsr){ o.home = sv.t + fromMin; return o; }
  var ready = sv.t + fromMin + buf; o.ready = ready;
  var best = null;
  for (var k = 0; k <= 2; k++){
    legTrains(addDays(rd, k), tr.hsr, home).forEach(function(c){
      var dep = c.dep + 1440 * k;
      // 可搭的車裡挑最早到家的(後發先至的直達車優先);同時到家選早發的
      var arr = c.arr + 1440 * k;
      if (dep >= ready && (!best || arr < best.arr || (arr === best.arr && dep < best.dep))) best = {n: c.n, dep: dep, arr: arr, k: k};
    });
    if (best) break;
  }
  if (!best){ o.err = '查不到回程高鐵班次,建議改搭客運／計程車。'; return o; }
  o.train = best;
  // 高鐵營運日以 04:00 為界:搭到的車已是「下一個營運日」= 當晚末班已過
  o.lastMissed = best.k > Math.floor((ready - 240) / 1440);
  o.home = best.arr;
  return o;
}
function rtRowOk(r, c){ return cfgRowOk(r, c, r.origin); }
/* 指定航空:每一段(用 + 、 和 , / 分開)都要對到有勾的航空;廉航關鍵字優先(同頁面航空分類) */
function airMatch(name, list){
  var parts = String(name || '').split(/\+|、|和|,|\//).map(function(p){ return p.trim().toLowerCase(); }).filter(Boolean);
  if (!parts.length) return false;
  var all = airList();
  return parts.every(function(p){
    var hit = all.filter(function(a){ return a.type === 'lcc' && a.keys.some(function(k){ return p.indexOf(k) >= 0; }); });
    if (!hit.length) hit = all.filter(function(a){ return a.type === 'fsc' && a.keys.some(function(k){ return p.indexOf(k) >= 0; }); });
    return hit.some(function(a){ return list.indexOf(a.k) >= 0; });
  });
}
function legCost(code, home){
  var tr = D.transfer ? D.transfer[code] : null;
  var p = {code: code, tr: tr, notes: []};
  p.noRail = !tr || !tr.hsr || tr.minutes_to_airport == null || tr.minutes_from_airport == null;
  p.same = !p.noRail && tr.hsr === home;
  if (p.noRail){
    p.hf = 0; p.tf = 0;
    p.notes.push('無高鐵直達,需自行安排接駁(高鐵與接駁費用以 0 計)');
  } else {
    if (p.same) p.hf = 0;
    else {
      p.hf = hsrFare(home, tr.hsr);
      if (p.hf === null){ p.hf = 0; p.notes.push('查不到' + home + '→' + tr.hsr + '高鐵票價,以 0 計'); }
    }
    if (tr.fare == null){ p.tf = 0; p.notes.push(tr.mode + '票價未知,以 0 計'); } else p.tf = tr.fare;
    if (!D.thsr) p.notes.push('缺高鐵時刻表,無法排班次');
  }
  return p;
}
function railLeg(kind, code, iso, hmv, day, home){
  var L = legCost(code, home);
  L.kind = kind; L.depHm = kind === 'out' ? hmv : null;
  if (!L.noRail && D.thsr){
    if (kind === 'out') L.out = planOut(iso, hmv, home, L.tr);
    else L.ret = planRet(iso, hmv, day, home, L.tr);
  }
  return L;
}
function sepOf(r){ return r.separate_tickets === true || !!(r.ret_airline && r.ret_airline !== r.airline); }
function rtPlans(c){
  if (!D.rt) return [];
  var home = c.home;
  return D.rt.rows.filter(function(r){ return rtRowOk(r, c); }).map(function(r){
    var p = legCost(r.origin, home);
    p.r = r; p.depHm = hm(r.out_dep);
    if (!p.noRail && D.thsr){
      p.out = planOut(r.depart, hm(r.out_dep), home, p.tr);
      p.ret = planRet(r['return'], hm(r.ret_arr), r.ret_arr_day, home, p.tr);
    }
    p.total = r.price + p.hf * 2 + p.tf * 2;
    p.sep = sepOf(r);
    return p;
  }).sort(function(a, b){ return a.total - b.total || a.r.price - b.r.price || (a.r.depart < b.r.depart ? -1 : 1); });
}


/* ---------- 時間線用的高鐵說明文字(滑鼠提示) ---------- */
function apShort(code){ return (AP[code] || code) + ' ' + code; }
/* p:{noRail, same, tr, out, depHm}(① 的方案或 railLeg 的回傳) */
function outRail(p, home){
  var tr = p.tr, o = p.out, n = [];
  if (p.noRail){ n.push('無高鐵直達,需自行安排接駁到機場(起飛前 2 小時 ' + (p.depHm !== null && p.depHm !== undefined ? hmText(p.depHm - 120) : '') + ' 前到)。'); return n; }
  if (!o){ n.push('缺高鐵時刻表,請自行查詢班次。'); return n; }
  if (o.err){ n.push(el('span', 'warnline', o.err)); return n; }
  if (p.same){
    n.push('住家站就是' + tr.hsr + ',不用搭高鐵 → ', el('b', null, hmText(o.board)), ' 前搭上' + tr.mode + '(' + tr.minutes_to_airport + ' 分) → 約 ',
      el('b', null, hmText(o.arrive)), ' 到機場(起飛前 2 小時 = ' + hmText(o.atAp) + ')');
    return n;
  }
  var t = o.train;
  n.push('建議 ', el('b', null, hmText(o.suggest)), ' 前到' + home + '高鐵站 → ',
    el('b', null, t.n + ' 次 ' + hmText(t.dep) + '→' + hmText(t.arr)), ' ' + tr.hsr + ' → ' + tr.mode + ' ' + tr.minutes_to_airport + ' 分' +
    (o.mrtWait ? '(等首班 ' + hmText(o.board) + ')' : '') + '(含轉乘緩衝 ' + (tr.buffer_min || 0) + ' 分) → 約 ',
    el('b', null, hmText(o.arrive)), ' 到機場(起飛前 2 小時 = ' + hmText(o.atAp) + ')');
  return n;
}
function retRail(p, home){
  var tr = p.tr, o = p.ret, n = [];
  if (p.noRail){ n.push('無高鐵直達,落地後需自行安排接駁。'); return n; }
  if (!o){ n.push('缺高鐵時刻表,請自行查詢班次。'); return n; }
  if (o.err && !o.train){ n.push(el('span', 'warnline', o.err)); return n; }
  var late = o.mrtWait || o.lastMissed;
  if (late){
    n.push(el('span', 'warnline', (o.mrtWait ? '落地出關約 ' + hmText(o.exit) + ',' + tr.mode + '已收班' : '末班高鐵已過') +
      ',建議住一晚或改搭客運／計程車。'), el('br'), '若等隔天首班:');
  }
  n.push('落地 ' + hmText(o.land) + ' → 入境約 60 分 → ' + tr.mode + ' ' + tr.minutes_from_airport + ' 分' + (o.mrtWait ? '(首班 ' + hmText(o.board) + ')' : ''));
  if (p.same){ n.push(' → 約 ', el('b', null, hmText(o.home)), ' 到' + tr.hsr + '(住家站,不用搭高鐵)'); return n; }
  var t = o.train;
  n.push(' → 轉乘緩衝 ' + (tr.buffer_min || 0) + ' 分 → ', el('b', null, t.n + ' 次 ' + hmText(t.dep)), ' ' + tr.hsr + ' → ',
    el('b', null, hmText(t.arr)), ' ' + home);
  return n;
}
function fmtIsoLocal(s){
  var t = Date.parse(s || ''); if (!isFinite(t)) return '';
  var p = tpeParts(t); return new Date(t + 8 * 3600e3).getUTCFullYear() + '-' + p.mo + '-' + p.da + ' ' + p.h + ':' + p.mi;
}
/* 計算假設 */
function assumeBox(fareLine){
  var T = D.thsr, as = el('div', 'assume');
  add(as, el('b', null, '計算假設'));
  var ul = el('ul');
  ['去程:起飛前 2 小時到機場;高鐵到站後加轉乘緩衝(各機場 10～20 分,見 transfer.json)再搭接駁;建議發車前 10 分鐘到高鐵站。',
   '回程:落地後入境、領行李約 60 分,接駁後再加轉乘緩衝,搭最早一班回住家站;落地已過午夜或末班已過會直接提醒。',
   fareLine,
   '高鐵時刻:' + (T ? (T.effective_note || '定期時刻表') + '(資料抓取 ' + T.fetched_at + ');只含已公告的加開／停駛,連假臨時車次請以高鐵官網為準。' : '沒有時刻表資料。'),
   '台北捷運(松山機場)末班車未逐一核對;台中機場(RMQ)無軌道直達,需自行安排接駁。'
  ].forEach(function(t){ add(ul, el('li', null, t)); });
  add(as, ul);
  return as;
}

/* ---------- 反向票／單程票方案計算 ---------- */
/* 條件過濾:tw = 這張票的台灣機場(去程票看 origin,日本出發的票看 dest) */
function cfgRowOk(r, c, tw){
  if (r.currency !== 'TWD') return false;
  if (c.origins.indexOf(tw) < 0 || c.cities.indexOf(r.city) < 0) return false;
  if (c.nonstop_only && r.nonstop !== true) return false;
  var m = c.airlines.mode;
  if (m === 'lcc' || m === 'fsc') return r.atype === m && (!r.ret_airline || r.ret_atype === m);
  if (m === 'list') return airMatch(r.airline, c.airlines.list) && (!r.ret_airline || airMatch(r.ret_airline, c.airlines.list));
  return true;
}
function railSum(legs){ return legs.reduce(function(s, L){ return s + L.hf + L.tf; }, 0); }
function notesOf(legs){
  var out = [];
  legs.forEach(function(L){ L.notes.forEach(function(n){ var t = apShort(L.code) + ':' + n; if (out.indexOf(t) < 0) out.push(t); }); });
  return out;
}
function tkOf(r){ return String(r.ticket || '').toUpperCase(); }
var PAIR_CAP = 8;   // 每個 combo 每種票最多取最便宜 8 張來配對(避免組合爆炸)
/* 一般買法:優先同 combo 的 N1/N2;找不到就找日期相同(N1:d1–r1、N2:d2–r2)、同 origin/city 的 */
function findN(kind, combo, d, r, origin, city, c){
  var cand = D.rv.rows.filter(function(x){ return tkOf(x) === kind && x.trip !== 'reverse' && x.city === city && cfgRowOk(x, c, x.origin); });
  var same = cand.filter(function(x){ return combo && x.combo === combo; });
  if (same.length){
    var so = same.filter(function(x){ return x.origin === origin; });
    return (so.length ? so : same).sort(rankCmp)[0];
  }
  var dm = cand.filter(function(x){ return ymd(x.depart) === d && ymd(x['return']) === r && x.origin === origin; });
  return dm.length ? dm.sort(rankCmp)[0] : null;
}
function rvPlans(c){
  if (!D.rv) return [];
  var home = c.home, groups = {}, plans = [];
  D.rv.rows.forEach(function(r){
    var t = tkOf(r); if (t !== 'A' && t !== 'B') return;
    var g = groups[r.combo || ''] || (groups[r.combo || ''] = {A: [], B: []});
    g[t].push(r);
  });
  Object.keys(groups).forEach(function(k){
    var g = groups[k];
    var As = g.A.filter(function(r){ return r.trip !== 'reverse' && cfgRowOk(r, c, r.origin); }).sort(rankCmp).slice(0, PAIR_CAP);
    var Bs = g.B.filter(function(r){ return cfgRowOk(r, c, r.dest); }).sort(rankCmp).slice(0, PAIR_CAP);
    As.forEach(function(A){ Bs.forEach(function(B){
      if (A.city !== B.city) return;
      var legs = [
        railLeg('out', A.origin, A.depart, hm(A.out_dep), 0, home),            // 第一段去程(票A)
        railLeg('ret', B.dest, B.depart, hm(B.out_arr), B.out_arr_day, home),   // 第一段回台(票B)
        railLeg('out', B.dest, B['return'], hm(B.ret_dep), 0, home),            // 第二段去程(票B)
        railLeg('ret', A.origin, A['return'], hm(A.ret_arr), A.ret_arr_day, home) // 第二段回台(票A)
      ];
      var p = {A: A, B: B, legs: legs, rail: railSum(legs), notes: notesOf(legs)};
      p.total = A.price + B.price + p.rail;
      p.N1 = findN('N1', A.combo, ymd(A.depart), ymd(B.depart), A.origin, A.city, c);
      p.N2 = findN('N2', A.combo, ymd(B['return']), ymd(A['return']), A.origin, A.city, c);
      if (p.N1 && p.N2){
        p.nrail = [p.N1.origin, p.N1.origin, p.N2.origin, p.N2.origin].reduce(function(s, o){ var L = legCost(o, home); return s + L.hf + L.tf; }, 0);
        p.norm = p.N1.price + p.N2.price + p.nrail;
        p.save = p.norm - p.total;
      }
      // 建議:兩種買法取較低者(一樣價時建議一般來回,票比較單純);一般買法缺資料只能用反向票價
      p.rec = (p.norm !== undefined && p.norm <= p.total) ? 'norm' : 'rev';
      p.best = p.rec === 'norm' ? p.norm : p.total;
      plans.push(p);
    }); });
  });
  return plans.sort(function(a, b){ return a.best - b.best || a.total - b.total || (a.A.depart < b.A.depart ? -1 : 1); });
}
/* 同日期、同出發機場與抵達機場的來回價(rt 掃描結果)→ 單程組合的對照 */
function rtAlt(O, R, c){
  if (!D.rt) return null;
  var list = D.rt.rows.filter(function(x){
    return x.trip === 'roundtrip' && x.origin === O.origin && x.city === O.city && (!x.dest || !O.dest || x.dest === O.dest) &&
      ymd(x.depart) === ymd(O.depart) && ymd(x['return']) === ymd(R.depart) && cfgRowOk(x, c, x.origin);
  }).sort(rankCmp);
  return list.length ? list[0] : null;
}
function owPlans(c){
  if (!D.ow) return [];
  var home = c.home, groups = {}, plans = [];
  D.ow.rows.forEach(function(r){
    var d = String(r.dir || '').toLowerCase(); if (d !== 'out' && d !== 'ret') return;
    var g = groups[r.combo || ''] || (groups[r.combo || ''] = {out: [], ret: []});
    g[d].push(r);
  });
  Object.keys(groups).forEach(function(k){
    var g = groups[k];
    var Os = g.out.filter(function(r){ return cfgRowOk(r, c, r.origin); }).sort(rankCmp).slice(0, PAIR_CAP);
    var Rs = g.ret.filter(function(r){ return cfgRowOk(r, c, r.dest); }).sort(rankCmp).slice(0, PAIR_CAP);
    Os.forEach(function(O){ Rs.forEach(function(R){
      if (ymd(R.depart) < ymd(O.depart)) return;
      var legs = [
        railLeg('out', O.origin, O.depart, hm(O.out_dep), 0, home),             // 去程(依去程台灣機場)
        railLeg('ret', R.dest, R.depart, hm(R.out_arr), R.out_arr_day, home)     // 回程(依回程台灣機場;時刻在 out_* 欄)
      ];
      var p = {O: O, R: R, legs: legs, rail: railSum(legs), notes: notesOf(legs)};
      p.total = O.price + R.price + p.rail;
      var alt = rtAlt(O, R, c);
      if (alt){
        var L = legCost(alt.origin, home);
        p.alt = alt; p.altTotal = alt.price + 2 * (L.hf + L.tf); p.altDiff = p.altTotal - p.total;
      }
      plans.push(p);
    }); });
  });
  return plans.sort(function(a, b){ return a.total - b.total || (a.O.price + a.R.price) - (b.O.price + b.R.price) || (a.O.depart < b.O.depart ? -1 : 1); });
}

function apCity(code){ return AP[code] || code; }
function needThsr(legs){ return legs.some(function(L){ return !L.noRail && !L.same; }); }

/* ---------- 促銷活動(有資料才顯示) ---------- */
function promosSection(){
  var sec = el('section'); sec.id = 'sec-promos'; add(sec, el('h2', null, '促銷活動'));
  var grid = el('div', 'promos');
  D.latest.promos.forEach(function(p){
    var c = el('div', 'promo'), t = el('div', 't'); add(t, extLink(p.url, p.title)); add(c, t);
    var dl = el('dl');
    [['航空公司', p.airline], ['促銷期間', p.sale_period], ['旅遊期間', p.travel_period]].forEach(function(kv){ add(dl, el('dt', null, kv[0]), el('dd', null, kv[1] || '—')); });
    add(c, dl); add(grid, c);
  });
  add(sec, grid);
  return sec;
}

/* ---------- 頁尾:資料狀況(收合) ---------- */
function footerBox(){
  var f = el('footer');
  var lt = D.latest;
  var x = detailsBox('status', false, 'statusdet');
  var hints = [];
  if (lt && lt.blocked.length) hints.push('被擋 ' + lt.blocked.length + ' 個來源');
  if (lt && lt.no_route.length) hints.push('無航線 ' + lt.no_route.length + ' 組');
  add(x.s, el('span', 'arr'), '資料狀況' + (hints.length ? '(' + hints.join('、') + ')' : '') + ' · 自動重新整理 · 免責聲明');
  var g = el('div', 'status');
  if (lt){
    var p1 = el('div', 'panel'); add(p1, el('h3', null, '被擋的來源'));
    if (!lt.blocked.length) add(p1, el('div', 'none', '本次沒有被擋的來源。'));
    else { var ul1 = el('ul'); lt.blocked.forEach(function(b){ var li = el('li'); add(li, el('b', null, b.source), ':' + b.reason); add(ul1, li); }); add(p1, ul1); }
    var p2 = el('div', 'panel'); add(p2, el('h3', null, '沒有航線的組合'));
    if (!lt.no_route.length) add(p2, el('div', 'none', '本次沒有回報無航線的組合。'));
    else { var ul2 = el('ul'); lt.no_route.forEach(function(n){ add(ul2, el('li', null, apName(n.origin) + ' → ' + apName(n.dest))); }); add(p2, ul2); }
    add(g, p1, p2);
    if (lt.note){ var p3 = el('div', 'panel'); add(p3, el('h3', null, '本次掃描備註'), el('div', null, lt.note)); add(g, p3); }
  }
  var p4 = el('div', 'panel'); add(p4, el('h3', null, '自動重新整理'));
  var rl = el('div', 'reload');
  var cd = el('b', null, ''); cd.id = 'reload-countdown';
  var rb = el('button', 'pbtn', '立即重新整理'); rb.type = 'button'; rb.id = 'reload-now';
  rb.addEventListener('click', function(){ location.reload(); });
  add(rl, '每 ' + D.reload_min + ' 分鐘自動重新整理,倒數', cd, rb);
  add(p4, rl, el('div', 'none', '頁面產生:' + D.generated_at));
  add(g, p4);
  add(x.d, g);
  if (D.skipped > 0) add(x.d, el('p', null, '另有 ' + D.skipped + ' 行資料格式不完整,已略過。'));
  if (lt && !lt.has_meta) add(x.d, el('p', null, '最新一次掃描在 scans.jsonl 沒有對應的中繼資料。'));
  add(x.d, el('p', null, '價格為掃描當下抓到的含稅價,實際以航空公司／訂票網站為準。訂票按鈕會開新分頁帶入機場與日期(1 位成人、台幣)。'));
  add(f, x.d);
  return f;
}

/* ---------- 整頁渲染 ---------- */
function renderAll(){
  var act = document.activeElement && document.activeElement.id;   // 整頁重繪後把焦點放回同一個欄位
  var app = clear(document.getElementById('app'));
  var y = window.scrollY;
  var hasData = !!(D.scan_count && D.latest);
  var states = hasData ? D.cities.filter(function(c){ return cityOk(c.name); }).map(computeCity) : [];
  if (!QF) qInit();
  PL = qPlans(QF);
  // 篩選列只在「價格觀察」分頁顯示
  document.getElementById('fbar').style.display = (hasData && TAB === 'watch') ? '' : 'none';
  add(app, hero(states), tabBar());
  if (TAB === 'find'){
    add(app, findSection());
  } else if (!hasData){
    add(app, emptyState());
  } else {
    var fd = filterDesc(); if (fd) add(app, el('div', 'fnote', fd));
    if (!states.length) add(app, el('div', 'empty-state', '請打開上方「進階篩選」至少勾選一個城市。'));
    else add(app, cardsSection(byPrice(states)));
    if (D.latest.promos.length) add(app, promosSection());
    if (states.length) add(app, chartSection(states));
  }
  add(app, footerBox());
  if (TAB === 'watch' && FADE) setTimeout(FADE, 0);
  window.scrollTo(0, y);
  if (act){ var fe = document.getElementById(act); if (fe && fe.focus) { try { fe.focus({preventScroll: true}); } catch (e) {} } }
}
function emptyState(){
  var box = el('div', 'empty-state');
  add(box, el('div', 'big', '尚未掃描'),
    el('p', null, '目前還沒有任何掃描紀錄。排程第一次跑完後,這裡會出現各城市的最低價、明細與走勢(頁面每 ' + D.reload_min + ' 分鐘會自動重新整理)。'));
  return box;
}

try {
  D = JSON.parse(document.getElementById('flight-data').textContent);
  KNOWN = D.origins;
  SLIDER_MAX = Math.max(10000, Math.ceil((D.price_max || 0) / 1000) * 1000 + 1000);
  var hasData = !!(D.scan_count && D.latest);
  F = hasData ? loadFilters() : defaults();
  buildFilterBar(hasData);
  qInit();
  renderAll();
  initCloud();
  startReload();
  var rzTimer = null;
  window.addEventListener('resize', function(){
    if (FADE) FADE();
    if (rzTimer) clearTimeout(rzTimer);
    rzTimer = setTimeout(function(){ if (TAB === 'watch' && lastChartW && Math.abs(chartWidth() - lastChartW) > 40) renderAll(); }, 250);
  });
  document.body.setAttribute('data-render-status', 'ok');
} catch (e){
  add(document.getElementById('app'), el('div', 'err', '頁面渲染失敗:' + (e && e.message ? e.message : e)));
  document.body.setAttribute('data-render-status', 'error');
}
})();
</script>
